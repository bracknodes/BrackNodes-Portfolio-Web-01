    <script>
      (function() {
        try {
          var stored = localStorage.getItem('ankit_portfolio_theme');
          var cmsRaw = localStorage.getItem('bracknodes_portfolio_cms_v2') || localStorage.getItem('ankit_portfolio_cms_v1');
          var themeMode = 'both';
          var defaultTheme = 'dark';
          if (cmsRaw) {
            var parsed = JSON.parse(cmsRaw);
            if (parsed && parsed.siteSettings && parsed.siteSettings.themeSettings) {
              if (parsed.siteSettings.themeSettings.themeMode) themeMode = parsed.siteSettings.themeSettings.themeMode;
              if (parsed.siteSettings.themeSettings.defaultTheme) defaultTheme = parsed.siteSettings.themeSettings.defaultTheme;
            }
          }
          var target = stored || defaultTheme;
          if (themeMode === 'dark-only') target = 'dark';
          if (themeMode === 'light-only') target = 'light';
          
          if (target === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>
