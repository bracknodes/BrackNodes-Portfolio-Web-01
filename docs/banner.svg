<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a11" />
      <stop offset="50%" stop-color="#0c111c" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c7ff6b" />
      <stop offset="100%" stop-color="#5cb3ff" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(199,255,107,0.25)" />
      <stop offset="100%" stop-color="rgba(92,179,255,0.05)" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bgGrad)" />
  <rect width="1200" height="480" fill="url(#grid)" />

  <!-- Neon Glowing Accents -->
  <circle cx="200" cy="120" r="180" fill="url(#glowGrad)" filter="blur(60px)" />
  <circle cx="1050" cy="380" r="220" fill="url(#glowGrad)" filter="blur(70px)" />

  <!-- Top Badge -->
  <g transform="translate(60, 60)">
    <rect width="320" height="32" rx="4" fill="rgba(199,255,107,0.1)" stroke="rgba(199,255,107,0.3)" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#c7ff6b" />
    <text x="32" y="21" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#c7ff6b" letter-spacing="1">ALL NODES OPERATIONAL • 99.99% SLA</text>
  </g>

  <!-- Main Hero Wordmark & Title -->
  <text x="60" y="150" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">
    BRACKNODES <tspan fill="url(#limeGrad)">CLOUD PORTFOLIO</tspan>
  </text>
  <text x="60" y="195" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Cyberpunk Digital Studio &amp; Infrastructure CMS with Full In-Browser Control
  </text>

  <!-- Feature Pills Grid -->
  <g transform="translate(60, 240)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="240" height="48" rx="4" fill="#0f1523" stroke="#1c2438" stroke-width="1" />
      <text x="16" y="22" font-family="'Courier New', monospace" font-size="11" fill="#c7ff6b" font-weight="bold">100% IN-BROWSER CMS</text>
      <text x="16" y="38" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Zero Rebuild Required</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(260, 0)">
      <rect width="240" height="48" rx="4" fill="#0f1523" stroke="#1c2438" stroke-width="1" />
      <text x="16" y="22" font-family="'Courier New', monospace" font-size="11" fill="#5cb3ff" font-weight="bold">INTERACTIVE 3D HERO</text>
      <text x="16" y="38" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Three.js Particle Sandbox</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(520, 0)">
      <rect width="240" height="48" rx="4" fill="#0f1523" stroke="#1c2438" stroke-width="1" />
      <text x="16" y="22" font-family="'Courier New', monospace" font-size="11" fill="#c7ff6b" font-weight="bold">cPANEL &amp; SUPABASE READY</text>
      <text x="16" y="38" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">1-Click MySQL Installer</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(780, 0)">
      <rect width="240" height="48" rx="4" fill="#0f1523" stroke="#1c2438" stroke-width="1" />
      <text x="16" y="22" font-family="'Courier New', monospace" font-size="11" fill="#5cb3ff" font-weight="bold">SEO &amp; RICH SNIPPETS</text>
      <text x="16" y="38" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">Googlebot &amp; XML Sitemap</text>
    </g>
  </g>

  <!-- Bottom Sponsor Callout -->
  <g transform="translate(60, 330)">
    <rect width="1080" height="90" rx="6" fill="rgba(14,20,33,0.9)" stroke="rgba(199,255,107,0.3)" stroke-width="1" />
    <g transform="translate(20, 25)">
      <text x="0" y="16" font-family="'Courier New', monospace" font-size="11" fill="#c7ff6b" font-weight="bold">⚡ SPONSORED CLOUD INFRASTRUCTURE</text>
      <text x="0" y="42" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">
        High-Speed NVMe cPanel Web &amp; 24/7 Discord Bot Hosting starting @ ₹29/month
      </text>
    </g>
    <g transform="translate(860, 26)">
      <rect width="200" height="38" rx="4" fill="#c7ff6b" />
      <text x="100" y="24" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#090b10" text-anchor="middle">
        Visit BrackNodes.in ↗
      </text>
    </g>
  </g>
</svg>

